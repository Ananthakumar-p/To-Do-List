services:
  mongo:
    image: mongo
    ports:
      - "8080:27017"

  backend:
    build: "./backend"
    ports:
      - "8000:8000"
    env_file:
      - "./backend/.env.prod"
    depends_on:
      - mongo

  frontend:
    build: "./frontend"
    ports:
      - "3000:3000"
    env_file:
      - "./frontend/.env.prod"
    depends_on:
      - backend
